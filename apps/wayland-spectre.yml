# AppImageHub descriptor for wayland-spectre
# PR: https://github.com/AppImage/appimage.github.io/pull/3733

- name: wayland-spectre
  description: >
    Wayland screen sharing diagnostic tool for KDE Plasma on Bazzite / Fedora.
    Checks eight diagnostic layers — GPU/NVIDIA, D-Bus/portal, portal backend,
    Wayland protocol globals, PipeWire, Flatpak permissions, environment, and
    KWin plugin activation — and reports pass/warn/fail per layer with suggested
    fixes. GUI (Tauri v2 + Svelte 5) and CLI modes. GPL-3.0-or-later.
  categories:
    - Utility
  authors:
    - name: WanderingM0nster
      url: https://github.com/WanderingM0nster
  license: GPL-3.0-or-later
