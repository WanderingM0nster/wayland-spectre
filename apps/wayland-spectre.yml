      url: https://forgejo.wanderingmonster.dev/WanderingMonster/wayland-spectre
    - type: Download
      url: https://forgejo.wanderingmonster.dev/WanderingMonster/wayland-spectre/releases/download/v0.3.0/wayland-spectre_0.3.0_amd64.AppImage
